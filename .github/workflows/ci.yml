name: Plugin source validation

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the dual plugin manifests
        run: |
          test -f plugins/com.xsec.workspace.sub-agent/plugin.json
          test -f plugins/com.xsec.workspace.sub-agent/.codex-plugin/plugin.json
